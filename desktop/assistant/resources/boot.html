<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><title>NanoMate</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#302e2a;font:13px 'Segoe UI','Microsoft YaHei UI',sans-serif}header{height:38px;display:flex;justify-content:space-between;align-items:center;background:#f0eee7;padding-left:16px;border-bottom:1px solid #e6e3da;-webkit-app-region:drag}header span{font-size:11px;color:#79766e}button{-webkit-app-region:no-drag;border:0;background:none;color:inherit;cursor:pointer}header button{height:38px;width:46px;font-size:20px}header button:hover{background:#b23b35;color:white}main{display:flex;align-items:center;justify-content:center;flex-direction:column;height:calc(100vh - 38px);padding:32px;text-align:center}.mark{color:#ad563c;font:36px Georgia,serif;letter-spacing:-5px;margin-bottom:24px}h1{font:32px Georgia,'SimSun',serif;font-weight:400;margin:0}p{color:#79766e;line-height:1.8;max-width:480px;margin-top:15px}.line{width:100px;height:2px;background:#e5e2d8;margin-top:30px;overflow:hidden}.line:after{content:'';display:block;width:40%;height:100%;background:#b75e42;animation:loading 1s ease-in-out infinite alternate}@keyframes loading{to{transform:translateX(150%)}}@media(prefers-reduced-motion:reduce){.line:after{animation:none;width:100%}}@media(prefers-color-scheme:dark){body{background:#22221f;color:#e9e6dd}header{background:#1c1d1a;border-color:#414039}p{color:#b3afa4}}
</style></head><body><header><span id="window-label">NanoMate · Personal assistant</span><button id="close" aria-label="Close">×</button></header><main><div class="mark">NⅢ</div><h1 id="title">A little help, every day.</h1><p id="detail">Starting your local workspace. Your data stays on this computer.</p><div class="line" id="progress"></div></main><script src="boot.js"></script></body></html>
